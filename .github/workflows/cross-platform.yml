name: Cross-platform core tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install portable test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile portable Python modules
        run: python -m py_compile redteam_logcat.py redteam_evidence_protocol.py central_collector.py platform/macos/redteam-macos-transport.py
      - name: Run portable viewer, protocol, central collector, and platform tests
        run: python -m pytest -q tests
      - name: Parse Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n install.sh
          bash install.sh --help
